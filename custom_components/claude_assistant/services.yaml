chat:
  name: Chat
  description: Send a message to Claude and log the response (response is written to the log; use the panel or conversation agent for interactive replies).
  fields:
    message:
      name: Message
      description: The message to send to Claude
      required: true
      example: "Summarize the state of my living room"
      selector:
        text:

clear_history:
  name: Clear conversation history
  description: Clear the stored conversation history used as chat context.
