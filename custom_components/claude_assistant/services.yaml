chat:
  name: Chat
  description: Send a message to Claude. The exchange lands in the panel's log and stats; with `response_variable` the reply is returned to the calling automation/script.
  fields:
    message:
      name: Message
      description: The message to send to Claude
      required: true
      example: "Summarize the state of my living room"
      selector:
        text:

clear_history:
  name: Clear conversation history
  description: Clear the stored conversation history used as chat context.
